[project]
name = "backend"
version = "0.1.0"
description = "Baby Names Explorer API — SQLite queries, precomputed forecasts, and a Groq-powered SQL chatbot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "groq>=0.12.0",
    "huggingface-hub>=1.30.0",
    "limits>=5.0.0",
    "pebble>=5.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "sentry-sdk[fastapi]>=2.68.1",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
# `uv sync --frozen --no-dev` builds the production image, so anything here is
# absent from the container. The fitting libraries belong here and not in
# [project.dependencies]: fitting runs only in the offline batch
# (scripts/forecast/), which the Dockerfile never copies. `lightgbm` and
# `scikit-learn` are what the pooled model needs; `statsmodels` and `scipy` are
# what the frozen ARIMA arm in research/forecasting still needs. `numpy` is
# here for the same reason and not because it is one of them: the request path
# composes stored JSON and touches no array, so the only code that needs it is
# the batch and the tests. See
# docs/adr/0004-forecasts-as-a-build-artifact.md and
# docs/adr/0010-a-pooled-model-replaces-per-name-arima.md.
dev = [
    "httpx>=0.27.0",
    "lightgbm>=4.5.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "pytest>=8.0.0",
    "ruff>=0.16.6",
    "scikit-learn>=1.5.0",
    "scipy>=1.11.0",
    "selenium>=4.49.0",
    "statsmodels>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
