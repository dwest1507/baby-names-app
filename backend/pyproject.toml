[project]
name = "backend"
version = "0.1.0"
description = "Baby Names Explorer API — SQLite queries, ARIMA forecasts, and a Groq-powered SQL chatbot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "groq>=0.12.0",
    "huggingface-hub>=0.26.0",
    "limits>=5.0.0",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.11.0",
    "slowapi>=0.1.9",
    "statsmodels>=0.14.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
